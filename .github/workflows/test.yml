name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      # 测试只依赖轻量部分：camel-oasis / camel-ai 仅在真正跑模拟的
      # 子进程里才需要，安装它们会让 CI 明显变慢。
      - name: Install test dependencies
        working-directory: backend
        run: |
          uv venv
          uv pip install \
            flask flask-cors python-dotenv pydantic openai \
            charset-normalizer chardet PyMuPDF "zep-cloud==3.13.0" \
            "stripe>=15.0.0" \
            pytest pytest-asyncio

      - name: Run pytest
        working-directory: backend
        env:
          LLM_API_KEY: test-key
          ZEP_API_KEY: test-key
        run: uv run --no-project pytest -q

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run vitest
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
