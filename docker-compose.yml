services:
  spidernet:
    # Built and pushed by .github/workflows/docker-image.yml
    image: ghcr.io/bigsassy420/spidernet:latest
    # Build locally instead of pulling:
    # build: .
    container_name: spidernet
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads